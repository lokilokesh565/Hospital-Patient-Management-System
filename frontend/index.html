<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital Patient Management System</title>

    <link rel="stylesheet" href="Styles.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="header-content">

            <h1>🏥 Hospital Patient Management</h1>

            <p>
                Patient registration, records and management dashboard
            </p>

        </div>

    </header>


    <main class="container">


        <!-- DASHBOARD -->

        <div class="dashboard">

            <div class="dashboard-card">

                <div class="icon">👥</div>

                <h3>Total Patients</h3>

                <div class="number" id="totalPatients">
                    0
                </div>

            </div>





        </div>


        <!-- PATIENT REGISTRATION -->

        <div class="section-title">

            <span>📝</span>

            <h2>Patient Registration</h2>

        </div>


        <form id="patientForm">

            <div class="form-grid">


                <div class="form-group">

                    <label>Patient Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter patient name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Age</label>

                    <input
                        type="number"
                        id="age"
                        placeholder="Enter age"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Gender</label>

                    <select id="gender" required>

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Phone</label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="Enter phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Disease</label>

                    <input
                        type="text"
                        id="disease"
                        placeholder="Enter disease"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Doctor</label>

                    <input
                        type="text"
                        id="doctor"
                        placeholder="Enter doctor name"
                        required
                    >

                </div>


                <div class="form-group full">

                    <label>Treatment Given</label>

                    <textarea
                        id="treatment"
                        placeholder="Enter treatment details"
                    ></textarea>

                </div>


                <div class="form-group full">

                    <label>Medications</label>

                    <textarea
                        id="medications"
                        placeholder="Enter medications"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>Admission Date</label>

                    <input
                        type="date"
                        id="admissionDate"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>&nbsp;</label>

                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        ➕ Add Patient
                    </button>

                </div>

            </div>

        </form>


        <!-- SEARCH -->

        <div class="section-title">

            <span>🔍</span>

            <h2>Search Patients</h2>

        </div>


        <form id="searchForm" class="search-box">

            <input
                type="text"
                id="search"
                placeholder="Search by patient name or phone..."
            >

            <button type="submit">
                🔍 Search
            </button>

        </form>


        <!-- VIEW ALL -->

        <div class="section-title">

            <span>📋</span>

            <h2>Patient Records</h2>

        </div>


        <button
            type="button"
            id="viewAllBtn"
            class="primary-btn"
        >
            👥 View All Patients
        </button>

        <!-- RESULTS -->

        <div id="searchResults"></div>


    </main>


    <script src="script.js"></script>

</body>

</html>
